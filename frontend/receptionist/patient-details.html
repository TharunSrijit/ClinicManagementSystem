<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Details | Receptionist — CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/tables.css" />
</head>
<body>

<!-- Mobile overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
  <a class="sidebar-brand" href="dashboard.html">
    <div class="sidebar-brand-icon">🏥</div>
    <div class="sidebar-brand-text">
      <span class="sidebar-brand-name">MediCare CMS</span>
      <span class="sidebar-brand-sub">Reception Desk</span>
    </div>
  </a>
  <nav class="sidebar-nav">
    <span class="nav-section-label">Main</span>
    <a class="nav-item" href="dashboard.html" id="nav-dashboard">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Dashboard</span>
    </a>
    <a class="nav-item" href="register-patient.html" id="nav-register">
      <span class="nav-item-icon">➕</span>
      <span class="nav-item-label">Register Patient</span>
    </a>
    <a class="nav-item active" href="search-patient.html" id="nav-search">
      <span class="nav-item-icon">🔍</span>
      <span class="nav-item-label">Search Patient</span>
    </a>
    <a class="nav-item" href="appointments.html" id="nav-today">
      <span class="nav-item-icon">📅</span>
      <span class="nav-item-label">Today's Appointments</span>
    </a>
    <a class="nav-item" href="token-queue.html" id="nav-queue">
      <span class="nav-item-icon">🎫</span>
      <span class="nav-item-label">Token Queue</span>
    </a>
    <a class="nav-item" href="billing.html" id="nav-billing">
      <span class="nav-item-icon">💰</span>
      <span class="nav-item-label">Billing</span>
    </a>
  </nav>
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sidebarAvatar">RC</div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sidebarName">Loading…</div>
      <div class="sidebar-user-role">Receptionist</div>
    </div>
    <button class="sidebar-logout-btn" onclick="logout()" title="Logout">⏏</button>
  </div>
</div>
<div class="main-content">

  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-toggle" onclick="openSidebar()">☰</button>
      <div>
        <div class="topbar-page-title">Patient Details</div>
        <div class="topbar-breadcrumb">
          <span>Receptionist</span>
          <span class="topbar-breadcrumb-sep">›</span>
          <span>Patient Details</span>
        </div>
      </div>
    </div>
    <div class="topbar-search">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search patient…" id="topbarSearch" />
    </div>
    <div class="topbar-right">
      <div style="font-size:var(--text-xs);color:var(--text-muted);font-weight:600;" id="topbarDate"></div>
      <div class="user-chip">
        <div class="user-chip-avatar" id="topbarAvatar">RC</div>
        <span class="user-chip-name" id="topbarName">Receptionist</span>
        <span class="user-chip-caret">▾</span>
      </div>
    </div>
  </header>
  <main class="page-content">
    <div class="page-header">
      <div class="page-header-left">
        <a href="search-patient.html" class="btn btn-ghost btn-sm" style="margin-bottom:8px;">← Back to Search</a>
        <h1 class="page-title" id="pageTitle">Patient Details</h1>
        <p class="page-subtitle" id="pageSubtitle">Loading…</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>

    <div id="detailsContent">
      <div style="padding:40px;text-align:center;color:var(--text-muted);">Loading patient data…</div>
    </div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>

/* ── AUTH GUARD ── */
const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
if (!loggedInUser || (loggedInUser.role !== 'receptionist' && loggedInUser.role !== 'admin')) {
  window.location.href = '../index.html';
}

/* ── SIDEBAR / TOPBAR INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  const name = loggedInUser.name || loggedInUser.username || 'Receptionist';
  const ini  = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
  ['sidebarAvatar','topbarAvatar'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = ini;
  });
  ['sidebarName','topbarName'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = name;
  });
  const dateEl = document.getElementById('topbarDate');
  if (dateEl) dateEl.textContent = new Date().toLocaleDateString('en-IN',
    {weekday:'long',year:'numeric',month:'long',day:'numeric'});
  if (typeof pageInit === 'function') pageInit();
});

function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
function logout() {
  if (!confirm('Are you sure you want to logout?')) return;
  localStorage.removeItem('loggedInUser');
  window.location.href = '../index.html';
}
function showToast(msg, type='info') {
  const icons = {success:'✅',danger:'⚠️',warning:'⚠️',info:'ℹ️'};
  const c = document.getElementById('toastContainer');
  if (!c) return;
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.innerHTML = '<span>' + (icons[type]||'ℹ️') + '</span><span>' + msg + '</span>';
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(24px)';
    el.style.transition='all .3s ease'; setTimeout(()=>el.remove(),300); }, 3200);
}

function getToday() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
}

const TODAY = getToday();
const AVATAR_COLOURS = ['#9C6B5D','#7e5249','#5c3a32','#2980b9','#27ae60','#d68910','#8e44ad','#c0392b','#16a085','#2c3e50'];
function avatarColor(id) { const n=(id||'').replace(/\D/g,''); return AVATAR_COLOURS[parseInt(n||'0')%AVATAR_COLOURS.length]; }
function initials_(name) { return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

function pageInit() {
  const pid = new URLSearchParams(location.search).get('id');
  if (!pid) { showErr('No patient ID provided. <a href="search-patient.html">Search for a patient</a>.'); return; }
  const patients = JSON.parse(localStorage.getItem('cms_patients') || '[]');
  const p = patients.find(x => x.id === pid);
  if (!p) { showErr('Patient <strong>' + pid + '</strong> not found.'); return; }
  renderPatient(p);
}

function showErr(html) {
  document.getElementById('detailsContent').innerHTML =
    '<div class="card" style="padding:32px;text-align:center;color:var(--danger);">' + html + '</div>';
}

function renderPatient(p) {
  document.getElementById('pageTitle').textContent = p.name;
  document.getElementById('pageSubtitle').textContent = p.id + ' · ' + (p.gender||'—') + ' · ' + (p.age||'—') + ' yrs';
  document.getElementById('pageActions').innerHTML =
    '<a href="book-appointment.html?patient=' + p.id + '" class="btn btn-primary btn-sm">📅 Book Appointment</a>';

  const appts = (JSON.parse(localStorage.getItem('cms_appointments')||'[]')).filter(a => a.patientId === p.id);
  const sc = {Booked:'badge-info',Confirmed:'badge-primary',Waiting:'badge-warning','In Progress':'badge-primary',Completed:'badge-success',Cancelled:'badge-danger'};

  document.getElementById('detailsContent').innerHTML = `
    <!-- Profile card -->
    <div class="card" style="margin-bottom:20px;">
      <div class="patient-profile-header">
        <div class="avatar" style="width:72px;height:72px;font-size:1.5rem;background:${avatarColor(p.id)}">${initials_(p.name)}</div>
        <div style="flex:1;min-width:200px;">
          <div style="font-size:var(--text-xl);font-weight:700;color:var(--text-primary);margin-bottom:4px;">${p.name}</div>
          <div style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:10px;">${p.id}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${p.blood ? '<span class="badge badge-primary">' + p.blood + '</span>' : ''}
            ${p.gender ? '<span class="badge badge-neutral">' + p.gender + '</span>' : ''}
            ${p.age ? '<span class="badge badge-neutral">' + p.age + ' years</span>' : ''}
          </div>
        </div>
      </div>
    </div>

    <div class="patient-info-grid">
      <!-- Contact Info -->
      <div class="card">
        <div class="card-header"><div class="card-title">📞 Contact Information</div></div>
        <div class="card-body">
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">PHONE</span><span style="font-size:var(--text-sm);font-weight:500;">${p.phone||'—'}</span></div>
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">EMAIL</span><span style="font-size:var(--text-sm);font-weight:500;">${p.email||'—'}</span></div>
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">EC NAME</span><span style="font-size:var(--text-sm);font-weight:500;">${p.ecName||'—'}</span></div>
          <div style="padding:8px 0;display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">EC PHONE</span><span style="font-size:var(--text-sm);font-weight:500;">${p.ecPhone||'—'}</span></div>
        </div>
      </div>
      <!-- Medical -->
      <div class="card">
        <div class="card-header"><div class="card-title">🩺 Medical Info</div></div>
        <div class="card-body">
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">BLOOD GROUP</span><span style="font-size:var(--text-sm);font-weight:500;">${p.blood||'—'}</span></div>
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">ALLERGIES</span><span style="font-size:var(--text-sm);font-weight:500;">${p.allergies||'None'}</span></div>
          <div style="padding:8px 0;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">DOB</span><span style="font-size:var(--text-sm);font-weight:500;">${p.dob||'—'}</span></div>
          <div style="padding:8px 0;display:flex;justify-content:space-between;"><span style="color:var(--text-muted);font-size:var(--text-xs);font-weight:700;">REGISTERED</span><span style="font-size:var(--text-sm);font-weight:500;">${p.registeredOn||'—'}</span></div>
        </div>
      </div>
    </div>

    <!-- Appointments history -->
    <div class="table-container">
      <div class="table-header">
        <div class="table-title">📅 Appointment History</div>
        <div class="table-header-right">
          <a href="book-appointment.html?patient=${p.id}" class="btn btn-primary btn-sm">+ Book New</a>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Token</th><th>Date</th><th>Time</th><th>Doctor</th><th>Type</th><th>Status</th></tr>
          </thead>
          <tbody>
            ${appts.length ? appts.map(a => `<tr>
              <td><span class="badge badge-neutral">#${String(a.token).padStart(2,'0')}</span></td>
              <td style="font-size:var(--text-sm);">${a.date}</td>
              <td style="font-weight:600;font-size:var(--text-sm);">${a.time}</td>
              <td style="font-size:var(--text-xs);">${a.doctor}</td>
              <td style="font-size:var(--text-xs);">${a.type}</td>
              <td><span class="badge ${sc[a.status]||'badge-neutral'}">${a.status}</span></td>
            </tr>`).join('') : '<tr><td colspan="6"><div class="table-empty"><div class="table-empty-icon">📭</div><div class="table-empty-title">No appointments yet</div></div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Billing history -->
    ${renderPatientBills(p)}`;
}

function renderPatientBills(p) {
  const bills = (JSON.parse(localStorage.getItem('cms_billing') || '[]')).filter(b => b.patientId === p.id);
  const typeBadgeStyles = {
    'Registration': 'background:#e8f5e9;color:#2e7d32;',
    'Consultation': 'background:#e3f2fd;color:#1565c0;',
    'Pharmacy': 'background:#fff3e0;color:#e65100;',
    'Lab Test': 'background:#f3e5f5;color:#7b1fa2;',
  };

  return `
    <div class="table-container" style="margin-top:20px;">
      <div class="table-header">
        <div class="table-title">💳 Billing History</div>
        <div class="table-header-right">
          <a href="billing.html?search=${encodeURIComponent(p.id)}" class="btn btn-secondary btn-sm">Manage in Billing</a>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Invoice</th><th>Date</th><th>Type</th><th>Doctor</th><th>Amount</th><th>Status</th><th>Payment Mode</th></tr>
          </thead>
          <tbody>
            ${bills.length ? bills.map(b => {
              const bType = b.type || (b.doctor ? 'Consultation' : 'General');
              const bStatus = b.status || 'Unpaid';
              const bAmount = Number(b.amount || 0).toFixed(2);
              const bDoc = b.doctor || '—';
              const bMethod = b.method || (bStatus === 'Paid' ? 'Cash' : '—');
              const badgeStyle = typeBadgeStyles[bType] || 'background:#f5f5f5;color:#616161;';
              return `<tr>
                <td><span class="badge badge-neutral" style="font-family:monospace;font-size:11px;">${b.id}</span></td>
                <td style="font-size:var(--text-sm);">${b.date || '—'}</td>
                <td><span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;${badgeStyle}">${bType}</span></td>
                <td style="font-size:var(--text-xs);">${bDoc}</td>
                <td style="font-weight:700;font-size:var(--text-sm);">₹${bAmount}</td>
                <td><span class="badge ${bStatus === 'Paid' ? 'badge-success' : 'badge-danger'}">${bStatus}</span></td>
                <td style="font-size:var(--text-xs);">${bMethod}</td>
              </tr>`;
            }).join('') : '<tr><td colspan="7"><div class="table-empty"><div class="table-empty-icon">🧾</div><div class="table-empty-title">No billing records found</div></div></td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
</script>
  <script src="../js/validation.js"></script>
</body>
</html>
